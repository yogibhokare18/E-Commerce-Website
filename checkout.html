<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Checkout | ShopEase</title>

    <link rel="stylesheet" href="checkout.css">

    <!-- Font Awesome -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>

    <!-- =========================
            HEADER
    ========================== -->

    <header class="header">

        <div class="logo">
            <a href="index.html">ShopEase</a>
        </div>

        <nav>

            <a href="index.html">Home</a>
            <a href="product.html">Products</a>
            <a href="cart.html">Cart</a>

        </nav>

    </header>

    <!-- =========================
            PAGE TITLE
    ========================== -->

    <section class="page-title">

        <h1>Checkout</h1>

        <p>Complete your order</p>

    </section>

    <!-- =========================
            CHECKOUT
    ========================== -->

    <section class="checkout-container">

        <!-- Customer Details -->

        <div class="checkout-form">

            <h2>Shipping Details</h2>

            <form id="checkout-form">

                <input
                    type="text"
                    id="name"
                    placeholder="Full Name"
                    required>

                <input
                    type="email"
                    id="email"
                    placeholder="Email Address"
                    required>

                <input
                    type="tel"
                    id="phone"
                    placeholder="Mobile Number"
                    required>

                <textarea
                    id="address"
                    rows="4"
                    placeholder="Delivery Address"
                    required></textarea>

                <input
                    type="text"
                    id="city"
                    placeholder="City"
                    required>

                <input
                    type="text"
                    id="pincode"
                    placeholder="PIN Code"
                    required>

                <h3>Payment Method</h3>

                <label>
                    <input
                        type="radio"
                        name="payment"
                        value="Cash on Delivery"
                        checked>

                    Cash on Delivery
                </label>

                <br><br>

                <label>
                    <input
                        type="radio"
                        name="payment"
                        value="UPI">

                    UPI
                </label>

                <br><br>

                <label>
                    <input
                        type="radio"
                        name="payment"
                        value="Credit/Debit Card">

                    Credit / Debit Card
                </label>

                <br><br>

                <button type="submit" id="place-order">

                    Place Order

                </button>

            </form>

        </div>

        <!-- Order Summary -->

        <div class="order-summary">

            <h2>Order Summary</h2>

            <div id="order-items">

                <!-- JS will load items here -->

            </div>

            <hr>

            <h3>

                Grand Total :
                ₹<span id="checkout-total">0</span>

            </h3>

        </div>

    </section>

    <!-- =========================
            FOOTER
    ========================== -->

    <footer>

        <p>

            © 2026 ShopEase. All Rights Reserved.

        </p>

    </footer>

    <!-- JavaScript -->

    <script src="checkout.js"></script>

</body>

</html>
